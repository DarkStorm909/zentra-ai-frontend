<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRA AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #08090f;
    color: #f4f4fb;
    height: 100dvh;
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #0c0d15;
}

header {
    padding: 18px;
    border-bottom: 1px solid #242536;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #7755ff, #00c9ff);
    color: white;
}

.brand {
    font-size: 18px;
    font-weight: 750;
    letter-spacing: 1.5px;
}

.status {
    font-size: 12px;
    color: #7edfa8;
    margin-top: 3px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.welcome {
    text-align: center;
    margin: auto 0;
    padding: 25px 10px;
}

.welcome-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 27px;
    margin: 0 0 10px;
}

.welcome p {
    color: #9698ae;
    line-height: 1.6;
    font-size: 14px;
}

.message {
    max-width: 88%;
    padding: 13px 16px;
    border-radius: 18px;
    line-height: 1.55;
    font-size: 15px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #6848ef, #5141c8);
    border-bottom-right-radius: 5px;
}

.bot {
    align-self: flex-start;
    background: #171925;
    border: 1px solid #292b3c;
    border-bottom-left-radius: 5px;
}

.label {
    font-size: 11px;
    color: #a9a4ff;
    margin-bottom: 5px;
    font-weight: 700;
}

footer {
    padding: 14px;
    border-top: 1px solid #242536;
    background: #0c0d15;
}

.composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: #171925;
    border: 1px solid #303247;
    border-radius: 17px;
}

input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 9px;
}

input::placeholder {
    color: #777a92;
}

button {
    border: none;
    cursor: pointer;
}

#send {
    background: linear-gradient(135deg, #7755ff, #4c78ff);
    color: white;
    border-radius: 12px;
    padding: 12px 15px;
    font-weight: 700;
}

#send:disabled {
    opacity: .5;
}

.note {
    text-align: center;
    font-size: 11px;
    color: #77798e;
    margin-top: 10px;
}

@media (min-width: 600px) {
    body {
        padding: 20px;
    }

    .app {
        height: calc(100dvh - 40px);
        border: 1px solid #292b3c;
        border-radius: 20px;
        overflow: hidden;
    }
}
</style>
</head>

<body>
<div class="app">

    <header>
        <div class="logo">Z</div>
        <div>
            <div class="brand">ZENTRA AI</div>
            <div class="status">● Local AI server</div>
        </div>
    </header>

    <main id="chat">
        <section class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>
            <h1>Meet ZENTRA AI</h1>
            <p>Your personal AI assistant.<br>
            Ask something to start a conversation.</p>
        </section>
    </main>

    <footer>
        <form class="composer" id="form">
            <input
                id="message"
                type="text"
                placeholder="Message ZENTRA..."
                autocomplete="off"
                required
            >
            <button id="send" type="submit">Send ↑</button>
        </form>
        <div class="note">ZENTRA AI · Your personal assistant</div>
    </footer>

</div>

<script>
const API_URL = "https://zentra-ai-backend-jade.vercel.app/chat";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");

function addMessage(text, sender) {
    const bubble = document.createElement("div");
    bubble.className = "message " + sender;

    if (sender === "bot") {
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "ZENTRA AI";
        bubble.appendChild(label);
    }

    const content = document.createElement("div");
    content.textContent = text;
    bubble.appendChild(content);

    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message) return;

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    addMessage(message, "user");
    input.value = "";
    sendButton.disabled = true;
    sendButton.textContent = "...";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message })
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        addMessage(data.reply || "The server returned no reply.", "bot");

    } catch (error) {
        addMessage(
            "Couldn't connect to ZENTRA's server. Make sure Uvicorn is running.",
            "bot"
        );
    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send ↑";
        input.focus();
    }
});
</script>

</body>
</html>
